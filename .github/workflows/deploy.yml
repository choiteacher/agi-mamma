# GitHub Pages 배포 (https://choiteacher.github.io/agi-mamma/)
# main 브랜치에 push하면 테스트 → 빌드 → 배포. 저장소 Settings → Pages → Source 를 "GitHub Actions"로 설정해야 한다.
# 액션 버전은 Vite 공식 문서(vite.dev/guide/static-deploy)의 예시와 같은 커밋으로 고정했다.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # 비밀번호 화면 없이 배포되지 않도록: gate.json(해시)이 없으면 중단
      - name: Check password gate
        run: test -f src/config/gate.json || (echo "src/config/gate.json 이 없습니다. 로컬에서 npm run set-password 후 커밋하세요." && exit 1)
      - name: Check secrets
        run: npm run check-secrets
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
